# Plantilla para rotación de logs
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    image: mongo:7
    logging: *default-logging
    volumes:
      - ./init-mongo.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - backend-mongodb:/data/db
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./backend/config/.env
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  redis:
    image: 'redis:7-alpine'
    logging: *default-logging
    volumes:
      - 'backend-redis:/data'
    networks:
      - backend
    restart: unless-stopped
    env_file:
      - ./backend/config/.env
    security_opt:
      - no-new-privileges:true
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASS\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASS\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  backend-daemons-workers:
    build:
      context: ./backend
      dockerfile: Dockerfile
    logging: *default-logging
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DOCKER: "true"
    env_file:
      - ./backend/config/.env
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  app-core:
    build:
      context: ./backend/app-core
      dockerfile: Dockerfile
    logging: *default-logging
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-uploads:/usr/src/app/uploads
    environment:
      DOCKER: "true"
    env_file:
      - ./backend/app-core/.env
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --server-response http://localhost:4000/ 2>&1 | grep -q \"HTTP/\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app-core:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    logging: *default-logging
    volumes:
      - backend-backups:/backups
      - backend-redis:/data:ro
      - backend-uploads:/uploads:ro
    env_file:
      - ./backend/config/.env
    environment:
      DOCKER: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

networks:
  backend:
    driver: bridge

volumes:
  backend-mongodb:
    driver: local
  backend-redis:
    driver: local
  backend-backups:
    driver: local
  backend-uploads:
    driver: local
