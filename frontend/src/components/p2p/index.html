<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruta P2P</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #111827);
        color: #e5e7eb;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        width: min(92vw, 640px);
        background: rgba(17, 24, 39, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 32px 24px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
      }
      h1 {
        margin-top: 0;
        font-size: 2rem;
      }
      p {
        line-height: 1.6;
        color: #cbd5e1;
      }
      a.button {
        display: inline-block;
        margin-top: 12px;
        background: #22c55e;
        color: #06220f;
        text-decoration: none;
        font-weight: 700;
        padding: 12px 18px;
        border-radius: 10px;
      }
      a.button:hover {
        background: #4ade80;
      }
      .small {
        font-size: 0.9rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Ruta P2P</h1>
      <p>
        Esta carpeta está disponible para descarga directa desde el servidor local.
      </p>
      <a class="button" href="./p2p.zip" download>Descargar carpeta P2P</a>
      <p class="small">Archivo generado: p2p.zip</p>
    </div>
  </body>
</html>
